services:
  traefik:
    image: traefik:v2.11
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
        aliases:
          - nginx

  dex:
    image: dexidp/dex:v2.45.1
    command:
      - /bin/sh
      - -ec
      - |
        set -eu
        : "$${APP_ATHENA_DEX_ISSUER_URL:=http://dex.localhost/dex}"
        : "$${APP_ATHENA_OAUTH_CALLBACK_URL:?APP_ATHENA_OAUTH_CALLBACK_URL is required}"
        : "$${APP_ATHENA_DEX_EXTRA_REDIRECT_URIS:=}"

        dex_users_config=/etc/athena-scripts/dex-users.yaml
        if [ -f /etc/athena-scripts/dex-users.local.yaml ]; then
          dex_users_config=/etc/athena-scripts/dex-users.local.yaml
        fi

        if [ -n "$${APP_ATHENA_DEX_EXTRA_REDIRECT_URIS}" ]; then
          printf '%s' "$${APP_ATHENA_DEX_EXTRA_REDIRECT_URIS}" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | awk 'NF { print "      - " $$0 }' > /tmp/dex-extra-redirect-uris.yaml
        else
          : > /tmp/dex-extra-redirect-uris.yaml
        fi

          escaped_oidc_client_secret=$$(printf '%s' "$${APP_ATHENA_OIDC_CLIENT_SECRET}" | sed 's/[\\&|]/\\&/g')
        sed \
          -e "s|__DEX_ISSUER__|$${APP_ATHENA_DEX_ISSUER_URL}|g" \
          -e "s|__DEX_REDIRECT_URI__|$${APP_ATHENA_OAUTH_CALLBACK_URL}|g" \
           -e "s|__DEX_CLIENT_SECRET__|$${escaped_oidc_client_secret}|g" \
          /etc/athena-scripts/dex-config.yaml > /tmp/dex-config.base.yaml

        awk '
          /# __DEX_EXTRA_REDIRECT_URIS__/ {
            while ((getline line < "/tmp/dex-extra-redirect-uris.yaml") > 0) {
              print line
            }
            close("/tmp/dex-extra-redirect-uris.yaml")
            next
          }
          { print }
        ' /tmp/dex-config.base.yaml > /tmp/dex-config.yaml
        cat "$${dex_users_config}" >> /tmp/dex-config.yaml
        exec dex serve /tmp/dex-config.yaml
    environment:
      APP_ATHENA_DEX_ISSUER_URL: ${APP_ATHENA_DEX_ISSUER_URL:-http://dex.localhost/dex}
      APP_ATHENA_OAUTH_CALLBACK_URL: ${APP_ATHENA_OAUTH_CALLBACK_URL:?APP_ATHENA_OAUTH_CALLBACK_URL is required}
      APP_ATHENA_DEX_EXTRA_REDIRECT_URIS: ${APP_ATHENA_DEX_EXTRA_REDIRECT_URIS:-}
      APP_ATHENA_OIDC_CLIENT_SECRET: ${APP_ATHENA_OIDC_CLIENT_SECRET:?APP_ATHENA_OIDC_CLIENT_SECRET is required}
    volumes:
      - ./scripts:/etc/athena-scripts:ro
    ports:
      - "5556:5556"
    labels:
      - traefik.enable=true
      - traefik.http.routers.dex.rule=Host(`dex.localhost`)
      - traefik.http.routers.dex.entrypoints=web
      - traefik.http.routers.dex-athena.rule=(Host(`athena.localhost`) || Host(`${APP_ATHENA_PUBLIC_HOST:-athena.localhost}`)) && PathPrefix(`/dex`)
      - traefik.http.routers.dex-athena.entrypoints=web
      - traefik.http.routers.dex-athena.priority=200
      - traefik.http.services.dex.loadbalancer.server.port=5556

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: athena
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athena}
    ports:
      - "5432:5432"
    volumes:
      - athena-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prepare:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-athena}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        psql -h postgres -U athena -d athena -v APP_ROLE_NAME=athena -f /migrations/pg/migrate.sql
        for f in /migrations/pg/seed.local/*.sql; do
          [ -e "$$f" ] || continue
          echo ">>> Running local seed: $$f"
          psql -h postgres -U athena -d athena -v APP_ROLE_NAME=athena -f "$$f"
        done

  # Deterministic inference service used by Playwright specs.
  test-inference:
    profiles:
      - test
    build:
      context: .
    command: ["node", "/app/node_modules/@canonical/test-inference/dist/server.js"]
    environment:
      PORT: "8080"
    # Playwright registers scenarios through this host port.
    ports:
      - "127.0.0.1:8099:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  athena:
    build:
      context: .
    depends_on:
      traefik:
        condition: service_started
      dex:
        condition: service_started
      postgres:
        condition: service_healthy
      prepare:
        condition: service_completed_successfully
    environment:
      APP_ATHENA_PORT: "8000"
      APP_ATHENA_NODE_ENV: development
      APP_ATHENA_ALLOWED_ORIGINS: ${APP_ATHENA_ALLOWED_ORIGINS:-http://athena.localhost}
      APP_ATHENA_FRONTEND_BASE_URL: ${APP_ATHENA_FRONTEND_BASE_URL:-http://athena.localhost}
      APP_ATHENA_DEV_MODE: ${APP_ATHENA_DEV_MODE:-false}
      APP_ATHENA_OAUTH_CALLBACK_URL: ${APP_ATHENA_OAUTH_CALLBACK_URL:?APP_ATHENA_OAUTH_CALLBACK_URL is required}
      APP_ATHENA_OIDC_DISCOVERY_URL: ${APP_ATHENA_OIDC_DISCOVERY_URL:-http://dex.localhost/dex/.well-known/openid-configuration}
      APP_ATHENA_OIDC_CLIENT_ID: ${APP_ATHENA_OIDC_CLIENT_ID:-athena}
      APP_ATHENA_OIDC_CLIENT_SECRET: ${APP_ATHENA_OIDC_CLIENT_SECRET:?APP_ATHENA_OIDC_CLIENT_SECRET is required}
      APP_ATHENA_SECRET_KEY: ${APP_ATHENA_SECRET_KEY:?APP_ATHENA_SECRET_KEY is required}
      APP_ATHENA_CREDENTIAL_ENCRYPTION_KEY: ${APP_ATHENA_CREDENTIAL_ENCRYPTION_KEY:?APP_ATHENA_CREDENTIAL_ENCRYPTION_KEY is required}
      APP_ATHENA_SESSION_MAX_AGE: ${APP_ATHENA_SESSION_MAX_AGE:-86400000}
      APP_ATHENA_POSTGRESQL_DB_CONNECT_STRING: ${APP_ATHENA_POSTGRESQL_DB_CONNECT_STRING:?APP_ATHENA_POSTGRESQL_DB_CONNECT_STRING is required}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      COVERAGE: ${COVERAGE:-}
    extra_hosts:
      - "dex.localhost:host-gateway"
    volumes:
      - ./src:/app/src
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.server.json:/app/tsconfig.server.json:ro
      - ./nodemon.json:/app/nodemon.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/_status/check >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.athena.rule=Host(`athena.localhost`) || Host(`${APP_ATHENA_PUBLIC_HOST:-athena.localhost}`)
      - traefik.http.routers.athena.entrypoints=web
      - traefik.http.services.athena.loadbalancer.server.port=8000

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      - athena
    restart: unless-stopped

volumes:
  athena-postgres-data:
