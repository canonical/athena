services:
  traefik:
    image: traefik:v2.11
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dex:
    image: dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./app/scripts/dex-config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    labels:
      - traefik.enable=true
      - traefik.http.routers.dex.rule=Host(`dex.localhost`)
      - traefik.http.routers.dex.entrypoints=web
      - traefik.http.services.dex.loadbalancer.server.port=5556

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: athena
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athena}
    ports:
      - "5432:5432"
    volumes:
      - athena-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prepare:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-athena}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        psql -h postgres -U athena -d athena -v APP_ROLE_NAME=athena -f /migrations/pg/migrate.sql

  athenabe:
    build:
      context: ./app
    depends_on:
      dex:
        condition: service_started
      postgres:
        condition: service_healthy
      prepare:
        condition: service_completed_successfully
    environment:
      APP_ATHENA_HOST: 0.0.0.0
      APP_ATHENA_PORT: "8080"
      APP_ATHENA_NODE_ENV: development
      APP_ATHENA_ALLOWED_ORIGINS: ${APP_ATHENA_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://athena.localhost}
      APP_ATHENA_RUN_MODE: ${APP_ATHENA_RUN_MODE:-production}
      APP_ATHENA_OAUTH_CALLBACK_URL: ${APP_ATHENA_OAUTH_CALLBACK_URL:-http://athenabe.localhost/authentication/callback}
      APP_ATHENA_OIDC_DISCOVERY_URL: ${APP_ATHENA_OIDC_DISCOVERY_URL:-http://dex.localhost/dex/.well-known/openid-configuration}
      APP_ATHENA_OIDC_CLIENT_ID: ${APP_ATHENA_OIDC_CLIENT_ID:-athena}
      APP_ATHENA_OIDC_CLIENT_SECRET: ${APP_ATHENA_OIDC_CLIENT_SECRET:-super-secret-value}
      APP_ATHENA_SECRET_KEY: ${APP_ATHENA_SECRET_KEY:-athena-dev-session-secret-change-me}
      APP_ATHENA_SESSION_MAX_AGE: ${APP_ATHENA_SESSION_MAX_AGE:-86400000}
      COVERAGE: ${COVERAGE:-}
      POSTGRESQL_DB_CONNECT_STRING: ${POSTGRESQL_DB_CONNECT_STRING}
    extra_hosts:
      - "dex.localhost:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/_status/check >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.athena-api.rule=Host(`athenabe.localhost`)
      - traefik.http.routers.athena-api.entrypoints=web
      - traefik.http.services.athena-api.loadbalancer.server.port=8080

  athena:
    build:
      context: ./app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
      COVERAGE: ${COVERAGE:-}
    command:
      - /bin/sh
      - -c
      - npm run dev:fe
    volumes:
      - ./app/src:/app/src
      - ./app/vite.config.ts:/app/vite.config.ts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5173 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.athena.rule=Host(`athena.localhost`)
      - traefik.http.routers.athena.entrypoints=web
      - traefik.http.services.athena.loadbalancer.server.port=5173

volumes:
  athena-postgres-data:
