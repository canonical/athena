services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: athena
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
    ports:
      - "5432:5432"
    volumes:
      - athena-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  athena:
    build:
      context: ./app
    environment:
      APP_ATHENA_HOST: 0.0.0.0
      APP_ATHENA_PORT: "8080"
      APP_ATHENA_RUN_MODE: production
      POSTGRESQL_DB_CONNECT_STRING: postgresql://athena:athena@postgres:5432/athena
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  athena-postgres-data:
