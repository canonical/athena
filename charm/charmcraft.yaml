# This file configures Charmcraft.
# See https://canonical-charmcraft.readthedocs-hosted.com/stable/reference/files/charmcraft-yaml-file/ for guidance.

name: athena

type: charm

base: ubuntu@24.04

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:

# (Required)
summary: Multi-agent orchestration service.

# (Required)
description: |
  Multi-agent orchestration service.

# The expressjs-framework extension provides the workload container ("app"), the
# "app-image" OCI resource, the ingress and logging relations, metrics endpoints,
# secret storage, and the data_platform_libs / traefik / observability charm libs.
extensions:
  - expressjs-framework

requires:
  postgresql:
    interface: postgresql_client
    optional: false
    limit: 1

config:
  options:
    node-env:
      type: string
      default: "production"
      description: >
        Node runtime environment, injected as APP_NODE_ENV. Athena's env accessor
        resolves the APP_ prefixed value before the framework-injected bare
        NODE_ENV, so this overrides it. Set to "development" for local testing to
        allow insecure (http) OIDC discovery; keep "production" otherwise.
    athena-port:
      type: int
      default: 8080
      description: >
        Application listen port, injected as APP_ATHENA_PORT. This must match the
        port the workload serves on (the expressjs-framework default is 8080).
        It is injected under the APP_ATHENA_ prefix so Athena's env accessor
        resolves it before the Kubernetes-injected `ATHENA_PORT` service-link
        variable (which holds a `tcp://host:port` URL and is not a number).
    allowed-origins:
      type: string
      default: "http://athena.localhost"
      description: >
        Comma-separated list of allowed CORS origins. Injected as APP_ALLOWED_ORIGINS.
    frontend-base-url:
      type: string
      default: "http://athena.localhost"
      description: >
        Public base URL of the Athena frontend. Injected as APP_FRONTEND_BASE_URL.
    oidc-discovery-url:
      type: string
      default: "http://dex.localhost/dex/.well-known/openid-configuration"
      description: >
        OIDC discovery document URL. Injected as APP_OIDC_DISCOVERY_URL.
    oidc-client-id:
      type: string
      default: "athena"
      description: >
        OIDC client id. Injected as APP_OIDC_CLIENT_ID.
    oauth-callback-url:
      type: string
      default: "http://athena.localhost/api/authentication/callback"
      description: >
        OAuth callback URL. Injected as APP_OAUTH_CALLBACK_URL.
    session-max-age:
      type: int
      description: >
        Session lifetime in milliseconds. Injected as APP_SESSION_MAX_AGE.
        Defaults to the application's built-in value when unset.
    oidc:
      type: secret
      description: >
        OIDC secret configuration. Create a Juju user secret containing the key
        `client-secret`, which is injected as APP_OIDC_CLIENT_SECRET.
    credential:
      type: secret
      description: >
        Credential encryption configuration. Create a Juju user secret containing
        the key `encryption-key`, which is injected as APP_CREDENTIAL_ENCRYPTION_KEY.
    secret:
      type: secret
      description: >
        Session signing secret. Create a Juju user secret containing the key
        `key`, which is injected as APP_SECRET_KEY.
