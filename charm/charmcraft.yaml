# This file configures Charmcraft.
# See https://canonical-charmcraft.readthedocs-hosted.com/stable/reference/files/charmcraft-yaml-file/ for guidance.

name: athena

type: charm

base: ubuntu@24.04

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:

# (Required)
summary: Multi-agent orchestration service.

# (Required)
description: |
  Multi-agent orchestration service.

# The expressjs-framework extension provides the workload container ("app"), the
# "app-image" OCI resource, the ingress and logging relations, metrics endpoints,
# secret storage, and the data_platform_libs / traefik / observability charm libs.
extensions:
  - expressjs-framework

charm-libs:
  - lib: traefik_k8s.ingress
    version: "2"
  - lib: tempo_coordinator_k8s.tracing
    version: "0"
  - lib: smtp_integrator.smtp
    version: "0"
  - lib: openfga_k8s.openfga
    version: "1"
  - lib: hydra.oauth
    version: "0"

requires:
  postgresql:
    interface: postgresql_client
    optional: false
    limit: 1

config:
  options:
    allowed-origins:
      type: string
      default: "http://athena.localhost"
      description: >
        Comma-separated list of allowed CORS origins. Injected as APP_ALLOWED_ORIGINS.
    sentry:
      type: secret
      description: |
        Sentry configuration used by Athena services.
        Secret can include:
        - dsn # Sentry DSN for Athena
        - environment # Sentry environment name, for example staging or production
        - traces-sample-rate # Trace sampling rate between 0 and 1, defaults to 0.1
      required: false
    pg-pool-max:
      description: Maximum number of clients in the PostgreSQL pool
      type: int
      default: 1
      required: false
    pg-pool-idle-timeout-ms:
      description: Idle timeout for PostgreSQL pool clients in milliseconds
      type: int
      default: 60000
      required: false
    frontend-base-url:
      type: string
      default: "http://athena.localhost"
      description: >
        Public base URL of the Athena frontend. Injected as APP_FRONTEND_BASE_URL.
    oauth-callback-url:
      type: string
      default: "http://athena.localhost/api/authentication/callback"
      description: >
        OAuth callback URL. Injected as APP_OAUTH_CALLBACK_URL.
    session-max-age:
      type: int
      description: >
        Session lifetime in milliseconds. Injected as APP_SESSION_MAX_AGE.
        Defaults to the application's built-in value when unset.
    oidc:
      type: secret
      description: >
        OIDC secret configuration. Create a Juju user secret containing the keys
        `discovery-url`, `client-id`, and `client-secret`, which are injected as
        APP_OIDC_DISCOVERY_URL, APP_OIDC_CLIENT_ID, and APP_OIDC_CLIENT_SECRET.
    credential:
      type: secret
      description: >
        Credential encryption configuration. Create a Juju user secret containing
        the key `encryption-key`, which is injected as APP_CREDENTIAL_ENCRYPTION_KEY.
