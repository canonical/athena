name: PR checks

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  test:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare compose environment file
        run: cp .example.env .env

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: athena-coverage-report
          path: testing/results/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Resolve latest coverage baseline artifact
        id: baseline_artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const workflowId = 'coverage-baseline.yaml';
            const artifactName = 'athena-coverage-baseline';

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: 'main',
              status: 'completed',
              per_page: 50,
            });

            const successfulRun = runs.workflow_runs.find((run) => run.conclusion === 'success');
            if (!successfulRun) {
              core.info('No successful coverage baseline workflow run found on main.');
              core.setOutput('found', 'false');
              return;
            }

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: successfulRun.id,
              per_page: 100,
            });

            const baselineArtifact = artifacts.artifacts.find(
              (artifact) => artifact.name === artifactName && !artifact.expired,
            );

            if (!baselineArtifact) {
              core.info(`Artifact ${artifactName} not found on workflow run ${successfulRun.id}.`);
              core.setOutput('found', 'false');
              return;
            }

            core.setOutput('found', 'true');
            core.setOutput('archive_download_url', baselineArtifact.archive_download_url);

      - name: Download coverage baseline artifact
        if: ${{ steps.baseline_artifact.outputs.found == 'true' }}
        run: |
          mkdir -p testing/results/coverage-baseline
          curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -L "${{ steps.baseline_artifact.outputs.archive_download_url }}" \
            -o /tmp/athena-coverage-baseline.zip
          unzip -o /tmp/athena-coverage-baseline.zip -d testing/results/coverage-baseline

      - name: Evaluate coverage delta against baseline
        id: coverage_delta
        if: ${{ steps.baseline_artifact.outputs.found == 'true' }}
        continue-on-error: true
        run: |
          node --experimental-strip-types ./testing/evaluate-coverage-delta.ts \
            ./testing/results/coverage/coverage-summary.json \
            ./testing/results/coverage-baseline/coverage-baseline.json \
            ./testing/results/coverage/coverage-comment.md

      - name: Post coverage comment
        if: ${{ github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && steps.coverage_delta.outcome != 'skipped' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COVERAGE_COMMENT_PATH: testing/results/coverage/coverage-comment.md
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- athena-coverage-report -->';

            if (!fs.existsSync(process.env.COVERAGE_COMMENT_PATH)) {
              core.warning(`Coverage comment file not found at ${process.env.COVERAGE_COMMENT_PATH}; skipping PR comment update.`);
              return;
            }

            const body = fs.readFileSync(process.env.COVERAGE_COMMENT_PATH, 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Report coverage regression
        if: ${{ steps.coverage_delta.outputs.has_regression == 'true' }}
        run: |
          echo "Coverage regression detected compared to the latest coverage baseline artifact"

      - name: Fail on coverage evaluation error
        if: ${{ steps.coverage_delta.outputs.evaluation_error == 'true' || (steps.coverage_delta.outcome == 'failure' && steps.coverage_delta.outputs.has_regression != 'true') }}
        run: |
          echo "Coverage delta evaluation failed due to malformed or missing coverage inputs"
          exit 1
