name: PR checks

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  test:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare compose environment file
        run: cp .example.env .env

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: athena-coverage-report
          path: testing/results/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Evaluate coverage delta against baseline
        id: coverage_delta
        continue-on-error: true
        run: |
          node --experimental-strip-types ./testing/evaluate-coverage-delta.ts \
            ./testing/results/coverage/coverage-summary.json \
            ./testing/coverage-baseline.json \
            ./testing/results/coverage/coverage-comment.md

      - name: Post coverage comment
        if: ${{ github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && steps.coverage_delta.outcome != 'skipped' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COVERAGE_COMMENT_PATH: testing/results/coverage/coverage-comment.md
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- athena-coverage-report -->';

            if (!fs.existsSync(process.env.COVERAGE_COMMENT_PATH)) {
              core.warning(`Coverage comment file not found at ${process.env.COVERAGE_COMMENT_PATH}; skipping PR comment update.`);
              return;
            }

            const body = fs.readFileSync(process.env.COVERAGE_COMMENT_PATH, 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on coverage regression
        if: ${{ steps.coverage_delta.outputs.has_regression == 'true' }}
        run: |
          echo "Coverage regression detected compared to testing/coverage-baseline.json"
          exit 1

      - name: Fail on coverage evaluation error
        if: ${{ steps.coverage_delta.outputs.evaluation_error == 'true' || (steps.coverage_delta.outcome == 'failure' && steps.coverage_delta.outputs.has_regression != 'true') }}
        run: |
          echo "Coverage delta evaluation failed due to malformed or missing coverage inputs"
          exit 1

      - name: Update and commit coverage baseline
        if: ${{ github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          node --experimental-strip-types ./testing/write-coverage-baseline.ts \
            ./testing/results/coverage/coverage-summary.json \
            ./testing/coverage-baseline.json

          if git diff --quiet -- testing/coverage-baseline.json; then
            echo "Coverage baseline already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testing/coverage-baseline.json
          git commit -m "ci: update coverage baseline [skip ci]"
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          git rebase "origin/${{ github.event.pull_request.head.ref }}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
