name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without pushing the rock to GHCR or publishing a release"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROCKCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: "true"
  CHARMCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: "true"

permissions: {}

jobs:
  prepare-release:
    name: Determine version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

  build-rock:
    name: Build rock
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stage the app into app/
        run: ./scripts/stage-app.sh

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup Rockcraft
        run: sudo snap install rockcraft --channel latest/edge --classic

      - name: Pack rock
        env:
          VITE_API_BASE_URL: "/api"
        run: rockcraft pack -v

      - name: Upload rock artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-rock-v${{ needs.prepare-release.outputs.version }}
          path: "*.rock"

      - name: Push rock to GHCR
        if: inputs.dry_run != true
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          ROCK_FILE="$(ls *.rock)"
          for TAG in "v${VERSION}" latest; do
            rockcraft.skopeo --insecure-policy copy \
              "oci-archive:${ROCK_FILE}" \
              "docker://ghcr.io/${OWNER}/athena:${TAG}" \
              --dest-creds "${OWNER}:${{ secrets.GITHUB_TOKEN }}"
          done

  build-charm:
    name: Build charm
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup Charmcraft
        run: sudo snap install charmcraft --channel latest/edge --classic

      - name: Fetch charm libs
        working-directory: charm
        run: charmcraft fetch-libs

      - name: Pack charm
        working-directory: charm
        run: charmcraft pack -v

      - name: Upload charm artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-charm-v${{ needs.prepare-release.outputs.version }}
          path: charm/*.charm

  release:
    name: Release
    needs: [prepare-release, build-rock, build-charm]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download rock artifact
        uses: actions/download-artifact@v4
        with:
          name: athena-rock-v${{ needs.prepare-release.outputs.version }}

      - name: Download charm artifact
        uses: actions/download-artifact@v4
        with:
          name: athena-charm-v${{ needs.prepare-release.outputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: athena@v${{ needs.prepare-release.outputs.version }}
          name: athena v${{ needs.prepare-release.outputs.version }}
          body: |
            Athena rock and charm v${{ needs.prepare-release.outputs.version }}.
            Rock image: `ghcr.io/${{ github.repository_owner }}/athena:v${{ needs.prepare-release.outputs.version }}`
          files: |
            *.rock
            *.charm
