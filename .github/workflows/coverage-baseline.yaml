name: Coverage Baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  refresh-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip coverage-baseline]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare compose environment file
        run: cp .example.env .env

      - name: Run coverage tests
        run: npm run test:ci

      - name: Update coverage baseline file
        run: |
          node --experimental-strip-types ./testing/write-coverage-baseline.ts \
            ./testing/results/coverage/coverage-summary.json \
            ./testing/coverage-baseline.json

      - name: Commit baseline update directly to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_file="testing/coverage-baseline.json"

          if git diff --quiet -- "$baseline_file"; then
            echo "Coverage baseline already up to date"
            exit 0
          fi

          baseline_content="$(base64 < "$baseline_file" | tr -d '\n')"
          baseline_sha=""
          sha_lookup_stderr="$(mktemp)"
          if baseline_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${baseline_file}" --jq .sha 2>"${sha_lookup_stderr}")"; then
            :
          elif grep -q "HTTP 404" "${sha_lookup_stderr}"; then
            baseline_sha=""
          else
            cat "${sha_lookup_stderr}" >&2
            rm -f "${sha_lookup_stderr}"
            exit 1
          fi
          rm -f "${sha_lookup_stderr}"

          sha_field=()
          if [[ -n "$baseline_sha" ]]; then
            sha_field+=(--field "sha=${baseline_sha}")
          fi

          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${baseline_file}" \
            --field message="ci: update coverage baseline [skip coverage-baseline]" \
            --field content="${baseline_content}" \
            "${sha_field[@]}" \
            --field branch="main" \
            >/dev/null

          echo "Coverage baseline updated on main"
