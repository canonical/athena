name: Coverage Baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  refresh-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip coverage-baseline]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare compose environment file
        run: cp .example.env .env

      - name: Run coverage tests
        run: npm run test:ci

      - name: Update coverage baseline file
        run: |
          node --experimental-strip-types ./testing/write-coverage-baseline.ts \
            ./testing/results/coverage/coverage-summary.json \
            ./testing/coverage-baseline.json

      - name: Commit baseline update to CI branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_file="testing/coverage-baseline.json"
          branch="ci/coverage-baseline"

          if git diff --quiet -- "$baseline_file"; then
            echo "Coverage baseline already up to date"
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$branch"
          git add "$baseline_file"
          git commit -m "ci: update coverage baseline [skip coverage-baseline]"
          git push origin "$branch" --force-with-lease

          existing_pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // ""')"
          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "ci: update coverage baseline" \
              --body "Automated coverage baseline refresh generated by the Coverage Baseline workflow."
          else
            echo "Updated existing PR #${existing_pr} for coverage baseline"
          fi
