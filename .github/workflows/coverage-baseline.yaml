name: Coverage Baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  refresh-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip coverage-baseline]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GIT_APP_ID }}
          private-key: ${{ secrets.GIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          token: ${{ steps.github-app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare compose environment file
        run: cp .example.env .env

      - name: Run coverage tests
        run: npm run test:ci

      - name: Update coverage baseline file
        run: |
          node --experimental-strip-types ./testing/write-coverage-baseline.ts \
            ./testing/results/coverage/coverage-summary.json \
            ./testing/coverage-baseline.json

      - name: Create or update baseline PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.github-app-token.outputs.token }}
          branch: ci/coverage-baseline
          base: main
          add-paths: testing/coverage-baseline.json
          commit-message: "ci: update coverage baseline [skip coverage-baseline]"
          title: "ci: update coverage baseline"
          body: "Automated coverage baseline refresh generated by the Coverage Baseline workflow."
          sign-commits: true
          delete-branch: false
