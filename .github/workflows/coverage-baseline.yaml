name: Coverage Baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  refresh-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip coverage-baseline]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run coverage tests
        working-directory: app
        run: npm run test:ci

      - name: Update coverage baseline file
        working-directory: app
        run: |
          node --experimental-strip-types ./testing/write-coverage-baseline.ts \
            ./testing/output/coverage/coverage-summary.json \
            ./testing/coverage-baseline.json

      - name: Commit baseline update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- app/testing/coverage-baseline.json; then
            echo "Coverage baseline already up to date"
            exit 0
          fi

          git add app/testing/coverage-baseline.json
          git commit -m "ci: update coverage baseline [skip coverage-baseline]"
          git push
